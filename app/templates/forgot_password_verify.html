{% extends "base.html" %}
{% block title %}Reset Code | Rocket Pub Server{% endblock %}

{% block content %}
<div class="auth-page">
    <div class="auth-card auth-card-wide">
        <div class="auth-heading">
            <h1>Enter reset code</h1>
            <p>
                Enter the six-digit code sent to
                <strong>{{ email }}</strong>.
            </p>
        </div>

        <form method="post" class="auth-form">
            <label>
                Reset code
                <input class="verification-code-input"
                       name="code"
                       inputmode="numeric"
                       autocomplete="one-time-code"
                       maxlength="6"
                       pattern="[0-9]{6}"
                       placeholder="000000"
                       required>
            </label>

            <button class="button auth-submit"
                    type="submit"
                    name="action"
                    value="verify">
                Continue
            </button>

            <button class="button secondary auth-submit"
                    type="submit"
                    name="action"
                    value="resend"
                    formnovalidate>
                Send a new code
            </button>
        </form>
    </div>
</div>
{% endblock %}
