{% extends "base.html" %}
{% block title %}Request Shift Swap | Rocket Pub Server{% endblock %}

{% block content %}
<div class="auth-page">
    <div class="auth-card auth-card-wide">
        <div class="auth-heading">
            <h1>Switch shift</h1>
            <p>
                {{ shift.shift_date.strftime("%A %d %B") }}
                · {{ shift_label(shift) }}
            </p>
        </div>

        <form method="post" class="auth-form">
            <label>Ask
                <select name="target_staff_id" id="swap-target" required>
                    {% for profile in other_profiles %}
                        <option value="{{ profile.id }}">{{ profile.rota_name }}</option>
                    {% endfor %}
                </select>
            </label>

            <label>
                Swap with one of their shifts (optional)
                <select name="target_shift_id" id="target-shift-select">
                    <option value="">They take / cover my shift</option>
                    {% for profile in other_profiles %}
                        {% for target_shift in target_shifts.get(profile.id, []) %}
                            <option value="{{ target_shift.id }}"
                                    data-staff-id="{{ profile.id }}">
                                {{ profile.rota_name }} —
                                {{ target_shift.shift_date.strftime("%a %d %b") }}
                                {{ shift_label(target_shift) }}
                            </option>
                        {% endfor %}
                    {% endfor %}
                </select>
            </label>

            <label>Message
                <textarea name="note" rows="3"
                          placeholder="Optional message"></textarea>
            </label>

            <button class="button auth-submit" type="submit">Send shift request</button>
            <a class="auth-secondary-link" href="{{ url_for('main.rota_home') }}">Cancel</a>
        </form>
    </div>
</div>

<script>
(function () {
    const staff = document.getElementById("swap-target");
    const shifts = document.getElementById("target-shift-select");

    function filterShifts() {
        const selected = staff.value;
        Array.from(shifts.options).forEach((option, index) => {
            if (index === 0) return;
            option.hidden = option.dataset.staffId !== selected;
        });
        shifts.value = "";
    }

    staff?.addEventListener("change", filterShifts);
    filterShifts();
})();
</script>
{% endblock %}
