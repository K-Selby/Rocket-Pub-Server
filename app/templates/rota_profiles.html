{% extends "base.html" %}
{% block title %}Rota Staff | Rocket Pub Server{% endblock %}

{% block content %}
<div class="page-heading">
    <div>
        <h1>Rota Staff</h1>
        <p>Archive or restore staff from the rota.</p>
    </div>
</div>

<div class="card">
    <div class="profile-list">
    {% for profile in profiles %}
        <div class="staff-profile-row {% if not profile.active %}user-disabled{% endif %}">
            <div>
                <strong>{{ profile.display_name }}</strong>
            </div>

            <div class="row-actions">
                {% if profile.active %}
                    <form method="post"
                          action="{{ url_for('main.rota_profile_archive', profile_id=profile.id) }}"
                          onsubmit="return confirm('Archive {{ profile.display_name }} from future rotas?');">
                        <button class="link-button danger" type="submit">
                            Archive
                        </button>
                    </form>
                {% else %}
                    <form method="post"
                          action="{{ url_for('main.rota_profile_restore', profile_id=profile.id) }}">
                        <button class="link-button" type="submit">
                            Restore
                        </button>
                    </form>
                {% endif %}
            </div>
        </div>
    {% endfor %}
    </div>
</div>
{% endblock %}
