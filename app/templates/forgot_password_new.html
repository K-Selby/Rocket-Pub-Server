{% extends "base.html" %}
{% block title %}New Password | Rocket Pub Server{% endblock %}

{% block content %}
<div class="auth-page">
    <div class="auth-card auth-card-wide">
        <div class="auth-heading">
            <h1>Choose a new password</h1>
            <p>
                Your email code has been verified.
            </p>
        </div>

        <form method="post" class="auth-form">
            <label>
                New password
                <input type="password"
                       name="new_password"
                       autocomplete="new-password"
                       minlength="8"
                       required>
            </label>

            <label>
                Confirm new password
                <input type="password"
                       name="confirm_password"
                       autocomplete="new-password"
                       minlength="8"
                       required>
            </label>

            <button class="button auth-submit" type="submit">
                Reset password
            </button>
        </form>
    </div>
</div>
{% endblock %}
