{% extends "base.html" %}
{% block title %}Forgot Password | Rocket Pub Server{% endblock %}

{% block content %}
<div class="auth-page">
    <div class="auth-card auth-card-wide">
        <div class="auth-heading">
            <h1>Forgot password</h1>
            <p>
                Enter your username and we'll send a six-digit reset code to
                the verified email on your account.
            </p>
        </div>

        <form method="post" class="auth-form">
            <label>
                Username
                <input name="username"
                       autocomplete="username"
                       required
                       autofocus>
            </label>

            <button class="button auth-submit" type="submit">
                Send reset code
            </button>

            <a class="auth-secondary-link"
               href="{{ url_for('main.login') }}">
                Back to sign in
            </a>
        </form>
    </div>
</div>
{% endblock %}
