{% extends "base.html" %}

{% block title %}New Table | Pub Booking System{% endblock %}

{% block content %}
<div class="page-heading">
    <div>
        <h1>Add table</h1>
        <p>Enter the physical characteristics of a table.</p>
    </div>
</div>

<form class="card form-grid" method="post">
    <label>
        Table number *
        <input name="number" required placeholder="e.g. 12">
    </label>

    <label>
        Capacity *
        <input type="number" name="capacity" min="1" max="30" required>
    </label>

    <label>
        Area *
        <select name="area_id" required>
            <option value="">Choose area</option>
            {% for area in areas %}
                <option value="{{ area.id }}">{{ area.name }}</option>
            {% endfor %}
        </select>
    </label>

    <label class="checkbox-row">
        <input type="checkbox" name="near_tv">
        Near a TV
    </label>

    <label class="checkbox-row">
        <input type="checkbox" name="accessible">
        Accessible
    </label>

    <label class="checkbox-row">
        <input type="checkbox" name="window_seat">
        Window seat
    </label>

    <div class="full-width">
        <button class="button" type="submit">Save table</button>
    </div>
</form>
{% endblock %}
