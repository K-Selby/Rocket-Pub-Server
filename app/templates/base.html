<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Rocket Pub Server{% endblock %}</title>
    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
<header class="topbar">
    <a class="brand"
       href="{{ url_for('main.dashboard') }}"
       aria-label="Rocket Pub Server dashboard">
        <span class="brand-logo-frame">
            <img src="{{ url_for('static', filename='images/rocket-pub-icon.png') }}"
                 alt="The Rocket Pub Liverpool logo">
        </span>

        <span class="brand-copy">
            <strong>Rocket Pub Server</strong>
            <small>The Rocket Pub · Liverpool</small>
        </span>
    </a>

    <nav>
        <a href="{{ url_for('main.dashboard') }}">Dashboard</a>
        <a href="{{ url_for('main.bookings') }}">Bookings</a>
        <a href="{{ url_for('main.large_parties') }}">Large Parties</a>
        <a href="{{ url_for('main.archive') }}">Archive</a>
        <a href="{{ url_for('main.customers') }}">Customers</a>
        <a href="{{ url_for('main.tables') }}">Tables</a>
        <a href="{{ url_for('main.table_layout') }}">Table Layout</a>
    </nav>
</header>

<main class="container">
    {% with messages = get_flashed_messages(with_categories=true) %}
        {% for category, message in messages %}
            <div class="flash {{ category }}">{{ message }}</div>
        {% endfor %}
    {% endwith %}

    {% block content %}{% endblock %}
</main>

<script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
